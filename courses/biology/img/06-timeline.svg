<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" width="600" height="580" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="600" height="580" fill="#ffffff"/><line x1="50" y1="30" x2="50" y2="540" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="50" r="13" fill="#3d85c6" stroke="#ffffff" stroke-width="3"/><text x="82" y="52" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">4,54 млрд</text><text x="82" y="80" font-size="22" font-weight="400" fill="#374151" text-anchor="start">утворилася Земля</text><circle cx="50" cy="116" r="13" fill="#3d85c6" stroke="#ffffff" stroke-width="3"/><text x="82" y="118" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">3,5 млрд</text><text x="82" y="146" font-size="22" font-weight="400" fill="#374151" text-anchor="start">найдавніші надійні сліди життя</text><circle cx="50" cy="182" r="13" fill="#3d85c6" stroke="#ffffff" stroke-width="3"/><text x="82" y="184" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">2,4 млрд</text><text x="82" y="212" font-size="22" font-weight="400" fill="#374151" text-anchor="start">кисень накопичується в повітрі</text><circle cx="50" cy="248" r="13" fill="#3d85c6" stroke="#ffffff" stroke-width="3"/><text x="82" y="250" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">≈ 1,8 млрд</text><text x="82" y="278" font-size="22" font-weight="400" fill="#374151" text-anchor="start">клітини з ядром (еукаріоти)</text><circle cx="50" cy="314" r="13" fill="#3d85c6" stroke="#ffffff" stroke-width="3"/><text x="82" y="316" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">≈ 540 млн</text><text x="82" y="344" font-size="22" font-weight="400" fill="#374151" text-anchor="start">кембрійський «вибух» тварин</text><circle cx="50" cy="380" r="13" fill="#3d85c6" stroke="#ffffff" stroke-width="3"/><text x="82" y="382" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">≈ 225 млн</text><text x="82" y="410" font-size="22" font-weight="400" fill="#374151" text-anchor="start">перші динозаври</text><circle cx="50" cy="446" r="13" fill="#3d85c6" stroke="#ffffff" stroke-width="3"/><text x="82" y="448" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">66 млн</text><text x="82" y="476" font-size="22" font-weight="400" fill="#374151" text-anchor="start">вимирання динозаврів</text><circle cx="50" cy="512" r="13" fill="#cc4125" stroke="#ffffff" stroke-width="3"/><text x="82" y="514" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">≈ 0,3 млн</text><text x="82" y="542" font-size="22" font-weight="400" fill="#374151" text-anchor="start">людина розумна</text><text x="580" y="570" font-size="18" font-weight="400" fill="#6b7280" text-anchor="end">років тому · не в масштабі</text></svg>
