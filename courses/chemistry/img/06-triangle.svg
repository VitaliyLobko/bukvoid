<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="600" height="330" fill="#ffffff"/><path d="M150 20L280 250H20Z" fill="#fff8e1" stroke="#fb8c00" stroke-width="4" stroke-linejoin="round"/><line x1="80" y1="145" x2="220" y2="145" stroke="#fb8c00" stroke-width="3" stroke-linecap="round"/><line x1="150" y1="145" x2="150" y2="250" stroke="#fb8c00" stroke-width="3" stroke-linecap="round"/><text x="150" y="120" font-size="44" font-weight="700" fill="#1f2937" text-anchor="middle">m</text><text x="102" y="220" font-size="40" font-weight="700" fill="#1f2937" text-anchor="middle">n</text><text x="198" y="220" font-size="40" font-weight="700" fill="#1f2937" text-anchor="middle">M</text><text x="320" y="70" font-size="22" font-weight="400" fill="#1f2937" text-anchor="start">m — маса, г</text><text x="320" y="120" font-size="22" font-weight="400" fill="#1f2937" text-anchor="start">n — кількість</text><text x="348" y="148" font-size="22" font-weight="400" fill="#1f2937" text-anchor="start">речовини, моль</text><text x="320" y="198" font-size="22" font-weight="400" fill="#1f2937" text-anchor="start">M — молярна маса,</text><text x="348" y="226" font-size="22" font-weight="400" fill="#1f2937" text-anchor="start">г/моль</text><text x="20" y="300" font-size="22" font-weight="600" fill="#6b7280" text-anchor="start">Закрийте пальцем шукане: n = m : M</text></svg>
