<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" font-family="system-ui, sans-serif">
  <rect width="440" height="420" fill="#ffffff"/>
  <!-- standoffs -->
  <rect x="22" y="30" width="12" height="300" fill="#8a8579"/>
  <rect x="406" y="30" width="12" height="300" fill="#8a8579"/>
  <!-- FC -->
  <rect x="10" y="44" width="420" height="128" rx="10" fill="#f2efe6" stroke="#2f6f9f" stroke-width="3"/>
  <g text-anchor="middle">
    <text x="220" y="74" font-size="20" font-weight="700" fill="#1d1c1a">Польотник — згори</text>
    <text x="220" y="104" font-size="16" fill="#2f6f9f">⑤ процесор · ⑥ гіроскоп · ⑦ blackbox</text>
    <text x="220" y="130" font-size="16" fill="#2f6f9f">⑧ UART · ⑨ I2C · ⑩ HD-роз'єм</text>
    <text x="220" y="156" font-size="16" fill="#2f6f9f">③ BEC 5 В · ④ BEC 9–10 В</text>
  </g>
  <!-- cable -->
  <path d="M220,172 L220,212" stroke="#2f6f9f" stroke-width="4" stroke-dasharray="7 5"/>
  <text x="230" y="198" font-size="15" fill="#2f6f9f">шлейф</text>
  <!-- ESC -->
  <rect x="10" y="212" width="420" height="104" rx="10" fill="#f2efe6" stroke="#c8641b" stroke-width="3"/>
  <g text-anchor="middle">
    <text x="220" y="242" font-size="20" font-weight="700" fill="#1d1c1a">ESC 4-в-1 — знизу</text>
    <text x="220" y="272" font-size="16" fill="#c8641b">① банки (S) · ② струм: тривалий / пік</text>
    <text x="220" y="298" font-size="16" fill="#c8641b">⑪ прошивка: Bluejay / AM32 / …</text>
  </g>
  <!-- mount -->
  <text x="220" y="364" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1c1a">⑫ кріплення 30,5 × 30,5 мм під M3</text>
  <text x="220" y="394" text-anchor="middle" font-size="15" fill="#5b574f">+ статус: чи є в магазині і запчастини</text>
</svg>
