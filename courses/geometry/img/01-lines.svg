<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="600" height="330" fill="#ffffff"/><text x="20" y="36" font-size="24" font-weight="600" fill="#6b7280" text-anchor="start">Пряма — без кінців</text><line x1="30" y1="80" x2="90" y2="80" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 8"/><line x1="90" y1="80" x2="510" y2="80" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/><line x1="510" y1="80" x2="570" y2="80" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 8"/><circle cx="180" cy="80" r="7" fill="#1f2937"/><circle cx="420" cy="80" r="7" fill="#1f2937"/><text x="180" y="62" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle" font-style="italic">A</text><text x="420" y="62" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle" font-style="italic">B</text><text x="20" y="146" font-size="24" font-weight="600" fill="#6b7280" text-anchor="start">Промінь — є початок, немає кінця</text><line x1="90" y1="190" x2="510" y2="190" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/><line x1="510" y1="190" x2="570" y2="190" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 8"/><circle cx="90" cy="190" r="7" fill="#1d4ed8"/><circle cx="330" cy="190" r="7" fill="#1d4ed8"/><text x="90" y="172" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle" font-style="italic">O</text><text x="330" y="172" font-size="30" font-weight="600" fill="#1f2937" text-anchor="middle" font-style="italic">A</text><text x="20" y="256" font-size="24" font-weight="600" fill="#6b7280" text-anchor="start">Відрізок — два кінці</text><line x1="90" y1="300" x2="510" y2="300" stroke="#2e7d32" stroke-width="4" stroke-linecap="round"/><circle cx="90" cy="300" r="7" fill="#2e7d32"/><circle cx="510" cy="300" r="7" fill="#2e7d32"/><text x="90" y="282" font