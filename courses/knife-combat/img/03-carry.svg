    <text x="520" y="34">ззаду</text>
  </g>
  <g fill="none" stroke="#4b5563" stroke-width="4">
    <circle cx="190" cy="80" r="30"/>
    <path d="M110 120 H270 L280 300 H100 Z"/>
    <circle cx="520" cy="80" r="30"/>
    <path d="M440 120 H600 L610 300 H430 Z"/>
  </g>
  <rect x="125" y="140" width="130" height="120" rx="10" fill="#9ca3af" opacity="0.45"/>
  <rect x="455" y="140" width="130" height="120" rx="10" fill="#9ca3af" opacity="0.45"/>
  <rect x="98" y="296" width="186" height="20" fill="#4b5563"/>
  <rect x="428" y="296" width="186" height="20" fill="#4b5563"/>
  <rect x="200" y="150" width="18" height="80" rx="4" fill="#2e7d32"/>
