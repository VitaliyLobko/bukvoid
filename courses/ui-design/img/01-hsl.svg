<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="600" height="330" fill="#ffffff"/>
<defs>
 <linearGradient id="h"><stop offset="0" stop-color="hsl(0,90%,50%)"/><stop offset=".1667" stop-color="hsl(60,90%,50%)"/><stop offset=".3333" stop-color="hsl(120,90%,50%)"/><stop offset=".5" stop-color="hsl(180,90%,50%)"/><stop offset=".6667" stop-color="hsl(240,90%,50%)"/><stop offset=".8333" stop-color="hsl(300,90%,50%)"/><stop offset="1" stop-color="hsl(360,90%,50%)"/></linearGradient>
 <linearGradient id="s"><stop offset="0" stop-color="hsl(215,0%,50%)"/><stop offset="1" stop-color="hsl(215,100%,50%)"/></linearGradient>
