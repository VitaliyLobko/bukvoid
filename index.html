<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131c">
  <meta name="description" content="Друк наосліп і курси: український правопис, англійська A2 і B1 — уроки, тести, тренажер">
  <title>Буквоїд</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('bukvoid:theme') || 'auto'; } catch (e) { /* приватний режим */ }
      var light = pref === 'light' || (pref === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
      // Розмір тексту — до першого кадру, щоб сторінка не стрибала
      try { var fs = localStorage.getItem('bukvoid:fs'); if (fs) document.documentElement.style.setProperty('--fs', fs); } catch (e) { /* приватний режим */ }
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
  <script src="version.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#view">До змісту</a>
  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="#druk">
        <svg viewBox="0 0 64 64" aria-hidden="true"><defs><mask id="brand-bite"><rect width="64" height="64" fill="#fff"/><circle cx="55" cy="11" r="9.5" fill="#000"/><circle cx="44.5" cy="6.5" r="5.2" fill="#000"/><circle cx="59.5" cy="22.5" r="5.2" fill="#000"/></mask></defs><rect x="6" y="6" width="52" height="52" rx="12" fill="var(--accent)" mask="url(#brand-bite)"/><path transform="translate(31 33) scale(.8) translate(-34.5 -33.5)" d="M20 15h25v8H29v6.5h7c8 0 13 4.5 13 11.3S44 52 36 52H20z M29 36.5v8h6.5c2.6 0 4.3-1.6 4.3-4s-1.7-4-4.3-4z" fill="var(--accent-ink)"/></svg>
        <span><b>Буквоїд</b><small>з'їдає помилки</small></span>
      </a>
      <nav class="tabs" aria-label="Розділи">
        <a href="#druk" data-tab="druk"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7.5 14h9"/></svg>Друк</a>
        <a href="#kursy" data-tab="kursy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>Курси</a>
        <a href="#progress" data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Прогрес</a>
      </nav>
      <a href="#settings" id="settings-btn" class="gear" aria-label="Налаштування">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8l1.6 2.3 2.7-.8.6 2.8 2.7.9-.9 2.7 2.3 1.6-2.3 1.6.9 2.7-2.7.9-.6 2.8-2.7-.8L12 21.2l-1.6-2.3-2.7.8-.6-2.8-2.7-.9.9-2.7L3 12l2.3-1.6-.9-2.7 2.7-.9.6-2.8 2.7.8z"/></svg>
      </a>
    </div>
  </header>

  <div id="update" class="update" hidden>
    <span>Доступна нова версія</span>
    <button type="button" id="update-btn" class="btn primary">Оновити</button>
  </div>

  <main>
    <div id="view" tabindex="-1"></div>
  </main>
