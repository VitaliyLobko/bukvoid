<!doctype html>
<html lang="uk">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131c">
  <meta name="description" content="Друк наосліп, український правопис і англійська: уроки, тести, тренажер">
  <title>Буквоїд</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('bukvoid:theme') || 'auto'; } catch (e) { /* приватний режим */ }
      var light = pref === 'light' || (pref === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
  <script src="version.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#view">До змісту</a>
  <header class="topbar">

      <a class="brand" href="#druk">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--accent)"/><path d="M20 14h26v8H29v7h7c8 0 13 4.5 13 11.5S44 52 36 52H20z M29 36.5v8h6.5c2.6 0 4.3-1.6 4.3-4s-1.7-4-4.3-4z" fill="var(--accent-ink)"/><circle cx="52" cy="12" r="9" fill="var(--bg)"/><circle cx="44" cy="6" r="5" fill="var(--bg)"/><circle cx="58" cy="21" r="5" fill="var(--bg)"/></svg>

        <a href="#english" data-tab="english"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h9M8.5 5c0 5-2 8-5 10M6 9c1.5 3 4 5 7 6"/><path d="M13 21l4-9 4 9M14.5 18h5"/></svg>English</a>
